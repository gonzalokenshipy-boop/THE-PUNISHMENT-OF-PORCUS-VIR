/* ============================================================
   3. AUDIO
============================================================ */
const Audio_ = (function(){
  let ctxA = null;
  let musicNodes = [];
  let musicTimer = null;
  let musicPattern = 'title';

  function ensure(){
    if(!ctxA){
      try{ ctxA = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ ctxA=null; }
    }
    if(ctxA && ctxA.state === 'suspended'){ ctxA.resume(); }
    return ctxA;
  }

  function tone(freq, dur, type, vol, delay){
    if(!G.options.sound) return;
    const ac = ensure(); if(!ac) return;
    delay = delay||0;
    const t0 = ac.currentTime + delay;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type||'square';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime((vol!==undefined?vol:1) * G.options.sfxVol, t0+0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(gain); gain.connect(ac.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }

  function noise(dur, vol){
    if(!G.options.sound) return;
    const ac = ensure(); if(!ac) return;
    const bufferSize = ac.sampleRate * dur;
    const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * (1 - i/bufferSize); }
    const src = ac.createBufferSource();
    src.buffer = buffer;
    const gain = ac.createGain();
    gain.gain.setValueAtTime((vol!==undefined?vol:0.5) * G.options.sfxVol, ac.currentTime);
    src.connect(gain); gain.connect(ac.destination);
    src.start();
  }

  const SFX = {
    shoot(){ tone(620,0.09,'square',0.5); },
    hit(){ tone(180,0.12,'sawtooth',0.5); },
    goblinDie(){ tone(340,0.1,'square',0.4); tone(220,0.14,'square',0.35,0.05); },
    playerHurt(){ noise(0.25,0.5); tone(120,0.3,'sawtooth',0.5); },
    soulPickup(){ tone(500,0.08,'sine',0.5); tone(760,0.12,'sine',0.5,0.08); tone(1000,0.16,'sine',0.45,0.16); },
    specialPickup(){ tone(400,0.08,'triangle',0.5); tone(700,0.1,'triangle',0.5,0.06); },
    specialExpire(){ tone(300,0.18,'triangle',0.35); tone(180,0.2,'triangle',0.3,0.08); },
    waveStart(){ tone(220,0.14,'square',0.5); tone(330,0.14,'square',0.5,0.12); tone(440,0.2,'square',0.55,0.24); },
    gameOver(){ tone(330,0.2,'sawtooth',0.5); tone(260,0.22,'sawtooth',0.5,0.18); tone(180,0.4,'sawtooth',0.5,0.36); },
    newRecord(){ tone(523,0.12,'square',0.5); tone(659,0.12,'square',0.5,0.12); tone(784,0.12,'square',0.5,0.24); tone(1046,0.25,'square',0.55,0.36); },
    confirmName(){ tone(600,0.1,'square',0.5); tone(900,0.16,'square',0.5,0.1); },
    pause(){ tone(440,0.12,'triangle',0.4); },
    resume(){ tone(560,0.12,'triangle',0.4); },
    navigate(){ tone(340,0.06,'square',0.3); },
    select(){ tone(520,0.09,'square',0.45); },
    reset(){ tone(200,0.3,'sawtooth',0.4); }
  };

  function stopMusic(){
    if(musicTimer){ clearInterval(musicTimer); musicTimer=null; }
  }

  function startMusic(pattern){
    stopMusic();
    musicPattern = pattern;
    if(!G.options.music) return;
    const ac = ensure(); if(!ac) return;
    const scalesTitle = [220,262,196,247, 220,262,330,294];
    const scalesPlay  = [196,220,247,196, 175,196,220,262];
    let step = 0;
    const seq = pattern==='title'? scalesTitle : scalesPlay;
    const stepMs = pattern==='title'? 380 : 230;
    musicTimer = setInterval(()=>{
      if(!G.options.music){ return; }
      const ac2 = ensure(); if(!ac2) return;
      const f = seq[step % seq.length];
      const t0 = ac2.currentTime;
      const osc = ac2.createOscillator();
      const gain = ac2.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(f, t0);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.linearRampToValueAtTime(0.22*G.options.musicVol, t0+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0+stepMs/1000*0.9);
      osc.connect(gain); gain.connect(ac2.destination);
      osc.start(t0); osc.stop(t0+stepMs/1000);
      if(step % 4 === 0){
        const bosc = ac2.createOscillator();
        const bgain = ac2.createGain();
        bosc.type='square';
        bosc.frequency.setValueAtTime(f/4, t0);
        bgain.gain.setValueAtTime(0.0001,t0);
        bgain.gain.linearRampToValueAtTime(0.12*G.options.musicVol, t0+0.02);
        bgain.gain.exponentialRampToValueAtTime(0.0001, t0+stepMs/1000*1.8);
        bosc.connect(bgain); bgain.connect(ac2.destination);
        bosc.start(t0); bosc.stop(t0+stepMs/1000*1.8);
      }
      step++;
    }, stepMs);
  }

  return { SFX, startMusic, stopMusic, ensure };
})();

/* ============================================================

============================================================ */
const Input = {
  left:false, right:false, shoot:false, shootPressed:false,
  up:false, down:false,
  enter:false, enterPressed:false,
  escape:false, escapePressed:false,
  pause:false, pausePressed:false,
  keyBuffer: []
};

function resetIdle(){ G.idleTimer = 0; G.attractMode = false; }

window.addEventListener('keydown', (e)=>{
  Audio_.ensure();
  resetIdle();
  const k = e.key;
  if(k==='a'||k==='A'||k==='ArrowLeft') Input.left = true;
  if(k==='d'||k==='D'||k==='ArrowRight') Input.right = true;
  if(k==='ArrowUp') Input.up = true;
  if(k==='ArrowDown') Input.down = true;
  if(k===' '){ if(!Input.shoot) Input.shootPressed = true; Input.shoot = true; e.preventDefault(); }
  if(k==='Enter'){ if(!Input.enter) Input.enterPressed = true; Input.enter = true; }
  if(k==='Escape'){ if(!Input.escape) Input.escapePressed = true; Input.escape = true; }
  if(k==='p'||k==='P'){ if(!Input.pause) Input.pausePressed = true; Input.pause = true; }

  if(G.state === STATES.NAME_ENTRY){
    if(k.length===1 && /[a-zA-Z0-9 ]/.test(k) && G.nameEntry.text.length < CONFIG.MAX_NAME_LEN){
      G.nameEntry.text += k.toUpperCase();
    } else if(k === 'Backspace'){
      G.nameEntry.text = G.nameEntry.text.slice(0,-1);
    }
  } else if(G.state === STATES.PASSWORD_ENTRY){
    if(k.length===1 && /[a-zA-Z0-9 ]/.test(k) && G.passwordEntry.text.length < CONFIG.MAX_PASSWORD_LEN){
      G.passwordEntry.text += k.toLowerCase();
    } else if(k === 'Backspace'){
      G.passwordEntry.text = G.passwordEntry.text.slice(0,-1);
    }
  }
  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k)) e.preventDefault();
});
window.addEventListener('keyup', (e)=>{
  const k = e.key;
  if(k==='a'||k==='A'||k==='ArrowLeft') Input.left = false;
  if(k==='d'||k==='D'||k==='ArrowRight') Input.right = false;
  if(k==='ArrowUp') Input.up = false;
  if(k==='ArrowDown') Input.down = false;
  if(k===' ') Input.shoot = false;
  if(k==='Enter') Input.enter = false;
  if(k==='Escape') Input.escape = false;
  if(k==='p'||k==='P') Input.pause = false;
});

// ---- Touch controls ----
const touchZones = { left:null, right:null, shoot:null };
const activeTouches = new Map();

function layoutTouchZones(){
  const w = CONFIG.WIDTH, h = CONFIG.HEIGHT;
  touchZones.left  = { x:10,  y:h-190, w:170, h:170 };
  touchZones.right = { x:195, y:h-190, w:170, h:170 };

layoutTouchZones();

const pauseZone = { x: CONFIG.WIDTH-90, y:50, w:80, h:80 };
const resumeZone = { x: CONFIG.WIDTH/2-200, y: CONFIG.HEIGHT/2+40, w:400, h:100 };

// ---- Botones virtuales universales de navegacion de menus ----
let menuNavZonesCurrent = {};
function menuNavConfig(){
  switch(G.state){
    case STATES.TITLE: return { ok:'START' };
    case STATES.MENU: return { up:true, down:true, ok:'SELECT' };
    case STATES.HIGH_SCORES: return { ok:'BACK' };
    case STATES.HOW_TO_PLAY: return { ok:'BACK' };
    case STATES.OPTIONS: return { up:true, down:true, ok: G.optionsConfirm?'CONFIRM':'TOGGLE', back:true };
    case STATES.GAME_OVER: return { ok:'CONTINUE' };
    default: return null;
  }
}
function drawMenuNavButtons(){
  const cfg = menuNavConfig();
  menuNavZonesCurrent = {};
  if(!cfg) return;
  const y = CONFIG.HEIGHT-104;
  if(cfg.up && cfg.down){
    menuNavZonesCurrent.up = { x:20, y:y-104, w:128, h:96 };
    menuNavZonesCurrent.down = { x:20, y:y, w:128, h:96 };
  }
  if(cfg.back){ menuNavZonesCurrent.back = { x:CONFIG.WIDTH-360, y:y, w:160, h:96 }; }
  if(cfg.ok){ menuNavZonesCurrent.ok = { x:CONFIG.WIDTH-180, y:y, w:160, h:96 }; }

  ctx.save();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  Object.entries(menuNavZonesCurrent).forEach(([key,z])=>{
    ctx.fillStyle='rgba(255,255,255,0.12)'; ctx.fillRect(z.x,z.y,z.w,z.h);
    ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=3; ctx.strokeRect(z.x,z.y,z.w,z.h);
    ctx.fillStyle='#fff'; ctx.font='bold 26px "Courier New", monospace';
    const label = key==='up' ? '▲' : key==='down' ? '▼' : key==='back' ? 'BACK' : cfg.ok;
    ctx.fillText(label, z.x+z.w/2, z.y+z.h/2+1);
  });
  ctx.restore();
  ctx.textBaseline='alphabetic';
}
function menuNavHit(x,y){
  for(const [key,z] of Object.entries(menuNavZonesCurrent)){
    if(x>=z.x && x<=z.x+z.w && y>=z.y && y<=z.y+z.h){
      if(key==='up'){ Input.up=true; handleMenuAxis(); Input.up=false; }
      else if(key==='down'){ Input.down=true; handleMenuAxis(); Input.down=false; }
      else if(key==='ok'){ onEnter(); }
      else if(key==='back'){ onEscape(); }
      return true;
    }
  }
  return false;
}

function pointInZone(px,py,z){ return px>=z.x && px<=z.x+z.w && py>=z.y && py<=z.y+z.h; }

function canvasCoordsFromEvent(touch){
  const rect = canvas.getBoundingClientRect();
  const scaleX = CONFIG.WIDTH / rect.width;
  const scaleY = CONFIG.HEIGHT / rect.height;
  return { x:(touch.clientX-rect.left)*scaleX, y:(touch.clientY-rect.top)*scaleY };
}

function handleMenuTapAt(x,y){
  // used for menu-like states: tap on option text areas
  if(G.state === STATES.MENU){
    const items = MENU_ITEMS;
    for(let i=0;i<items.length;i++){
      const iy = 300 + i*54;
      if(y > iy-28 && y < iy+20){ G.menuIndex = i; Audio_.SFX.select(); confirmMenu(); return; }
    }
  } else if(G.state === STATES.TITLE){
    goToMenu();
  } else if([STATES.HIGH_SCORES, STATES.HOW_TO_PLAY].includes(G.state)){
    G.state = STATES.MENU; Audio_.SFX.navigate();
  } else if(G.state === STATES.OPTIONS){
    // handled by dedicated buttons drawn; simplistic: tap toggles based on row
  } else if(G.state === STATES.GAME_OVER){
    advanceGameOver();
  }
}

/* ------------------------------------------------------------
   Manejo unificado de toques (touchstart)
   Cada toque se procesa UNA sola vez, con un unico listener y
   ramas explicitas por estado. Esto evita que dos listeners
   procesen el mismo evento y que se produzcan transiciones en
   cascada (por ejemplo, GAME_OVER -> NAME_ENTRY -> confirmar
   el nombre en el mismo toque).
------------------------------------------------------------- */

// Zona del boton CONFIRMAR de NAME_ENTRY y geometria de su teclado táctil
const NAME_VKB_START_Y = 190;
const NAME_VKB_KEY_W = 68;
const NAME_VKB_KEY_H = 46;
const NAME_VKB_GAP = 6;
const NAME_CONFIRM_ZONE = { x: CONFIG.WIDTH/2-150, y:410, w:300, h:64 };

// Geometria del teclado táctil y botones de PASSWORD_ENTRY
const PW_VKB_START_Y = 260;
const PW_VKB_KEY_W = 56;
const PW_VKB_KEY_H = 38;
const PW_VKB_GAP = 5;
const PW_CANCEL_ZONE = { x: CONFIG.WIDTH/2-170, y:190, w:150, h:50 };
const PW_CONFIRM_ZONE = { x: CONFIG.WIDTH/2+20, y:190, w:150, h:50 };

function handleNameEntryTouch(p){
  // Solo las teclas virtuales escriben el nombre, y solo el boton
  // CONFIRMAR explicito confirma. Ningun otro toque hace nada.
  if(G.scoreSubmitPending) return;
  if(vkbHit(p.x, p.y, G.nameEntry, CONFIG.MAX_NAME_LEN, NAME_VKB_START_Y, NAME_VKB_KEY_W, NAME_VKB_KEY_H, NAME_VKB_GAP)) return;
  if(pointInZone(p.x, p.y, NAME_CONFIRM_ZONE)){ confirmNameEntry(); return; }
  // tocar fuera del teclado y del boton CONFIRMAR: no hace nada
}

function handlePasswordEntryTouch(p){
  if(pointInZone(p.x,p.y, PW_CANCEL_ZONE)){
    G.passwordEntry.text = ''; G.passwordError = 0;
    G.state = STATES.OPTIONS; Audio_.SFX.navigate();
    return;
  }
  if(pointInZone(p.x,p.y, PW_CONFIRM_ZONE)){ confirmPasswordEntry(); return; }
  vkbHit(p.x,p.y, G.passwordEntry, CONFIG.MAX_PASSWORD_LEN, PW_VKB_START_Y, PW_VKB_KEY_W, PW_VKB_KEY_H, PW_VKB_GAP);
}

function handleTouchTap(t, p){
  if(G.state === STATES.PLAYING){
    if(pointInZone(p.x,p.y,touchZones.left)){ activeTouches.set(t.identifier,'left'); Input.left = true; }
    else if(pointInZone(p.x,p.y,touchZones.right)){ activeTouches.set(t.identifier,'right'); Input.right = true; }
    else if(pointInZone(p.x,p.y,touchZones.shoot)){ activeTouches.set(t.identifier,'shoot'); Input.shoot = true; Input.shootPressed = true; }
    else if(pointInZone(p.x,p.y,pauseZone)){ onPauseKey(); }
    return;
  }
  if(G.state === STATES.PAUSED){
    if(pointInZone(p.x,p.y,resumeZone)){ onPauseKey(); }
    return;
  }
  if(G.state === STATES.NAME_ENTRY){
    handleNameEntryTouch(p);
    return;
  }
  if(G.state === STATES.PASSWORD_ENTRY){
    handlePasswordEntryTouch(p);
    return;
  }
  // Estados de menu (TITLE, MENU, HIGH_SCORES, HOW_TO_PLAY, OPTIONS, GAME_OVER):
  // responden EXCLUSIVAMENTE a los botones virtuales ▲ ▼ SELECT/OK BACK.
  // Ningun otro toque en la pantalla navega ni selecciona nada.
  menuNavHit(p.x,p.y);
}

canvas.addEventListener('touchstart', (e)=>{
  e.preventDefault();
  Audio_.ensure();
  resetIdle();
  for(const t of e.changedTouches){
    const p = canvasCoordsFromEvent(t);
    handleTouchTap(t, p);
  }
}, {passive:false});

canvas.addEventListener('touchend', (e)=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    const zone = activeTouches.get(t.identifier);
    if(zone==='left') Input.left=false;
    if(zone==='right') Input.right=false;
    if(zone==='shoot') Input.shoot=false;
    activeTouches.delete(t.identifier);
  }
}, {passive:false});

canvas.addEventListener('touchcancel', (e)=>{
  for(const t of e.changedTouches){
    const zone = activeTouches.get(t.identifier);
    if(zone==='left') Input.left=false;
    if(zone==='right') Input.right=false;
    if(zone==='shoot') Input.shoot=false;
    activeTouches.delete(t.identifier);
  }
});

/* ============================================================
   RANKING GLOBAL - SUPABASE
============================================================ */
function supabaseHeaders(extra){
  // 🔐 La publishable key nueva de Supabase debe enviarse como `apikey`.
  // No la enviamos como Bearer porque las claves sb_publishable_... no son JWT.
  return Object.assign({
    'apikey': CONFIG.SUPABASE_KEY
  }, extra || {});
}

function supabaseWriteHeaders(){
  return {
    'apikey': CONFIG.SUPABASE_KEY,
    'Content-Type': 'application/json'
  };
}

function supabaseScoresUrl(){
  return CONFIG.SUPABASE_URL + '/rest/v1/' + CONFIG.SUPABASE_TABLE;
}

function normalizeScores(rows){
  return (Array.isArray(rows)?rows:[])
    .map(r=>({
      name: String(r.player_name || 'PLAYER').slice(0, CONFIG.MAX_NAME_LEN),
      score: Math.max(0, Math.floor(Number(r.score) || 0))
    }))
    .sort((a,b)=>b.score-a.score)
    .slice(0, CONFIG.MAX_HIGH_SCORES);
}

async function refreshGlobalHighScores(){
  G.highScoresLoading = true;
  G.highScoresError = false;
  try{
    const url = supabaseScoresUrl()
      + '?select=player_name,score,created_at'
      + '&order=score.desc,created_at.asc'
      + '&limit=' + CONFIG.MAX_HIGH_SCORES;
    const response = await fetch(url, {
      method:'GET',
      headers:supabaseHeaders()
    });
    if(!response.ok) throw new Error('Supabase HTTP ' + response.status);
    const rows = await response.json();
    G.highScores = normalizeScores(rows);
    G.highScoresReady = true;
    return true;
  }catch(error){
    console.error('Error cargando ranking global:', error);
    G.highScoresError = true;
    return false;
  }finally{
    G.highScoresLoading = false;
  }
}

async function submitScore(name, score){
  G.scoreSubmitPending = true;
  try{
    const cleanName = String(name || 'PLAYER').trim().slice(0, CONFIG.MAX_NAME_LEN) || 'PLAYER';
    const cleanScore = Math.max(0, Math.floor(Number(score) || 0));
    const response = await fetch(supabaseScoresUrl() + '?select=player_name,score,created_at', {
      method:'POST',
      headers:supabaseWriteHeaders({'Prefer':'return=representation'}),
      body:JSON.stringify({ player_name: cleanName, score: cleanScore })
    });
    if(!response.ok) throw new Error('Supabase HTTP ' + response.status);
    await refreshGlobalHighScores();
    return true;
  }catch(error){
    console.error('Error enviando puntuación:', error);
    G.highScoresError = true;
    return false;
  }finally{
    G.scoreSubmitPending = false;
  }
}

async function checkGlobalRankingForScore(score){
  const ok = await refreshGlobalHighScores();
  if(G.state !== STATES.GAME_OVER) return;
  if(!ok){
    G.gameOverPhase = 'error';
    return;
  }
  G.isNewRecord = isHighScore(score);
  G.gameOverPhase = isTop10Score(score) ? 'record' : 'normal';
}

function goToTitle(){ G.state = STATES.TITLE; Audio_.startMusic('title'); resetIdle(); }
function goToMenu(){ G.state = STATES.MENU; G.menuIndex=0; Audio_.SFX.navigate(); Audio_.startMusic('title'); }

function confirmMenu(){
  const choice = MENU_ITEMS[G.menuIndex];
  Audio_.SFX.select();
  if(choice==='PLAY'){ startNewGame(); }
  else if(choice==='HIGH SCORES'){ G.state = STATES.HIGH_SCORES; refreshGlobalHighScores(); }
  else if(choice==='HOW TO PLAY'){ G.state = STATES.HOW_TO_PLAY; }
  else if(choice==='OPTIONS'){ G.state = STATES.OPTIONS; G.optionsIndex=0; G.optionsConfirm=false; }
}

function isHighScore(score){
  // Una puntuacion es record SOLO si supera el puntaje del Top 1 actual.
  if(!G.highScoresReady) return false;
  if(!Number.isFinite(score) || score <= 0) return false;
  if(G.highScores.length === 0) return true;
  return score > G.highScores[0].score;
}

function isTop10Score(score){
  // Determina si el puntaje entra al Top 10 (habilita ingresar el nombre
  // y subir el puntaje al ranking global), independientemente de si es
  // o no el nuevo record absoluto (#1).
  if(!G.highScoresReady) return false;
  if(!Number.isFinite(score) || score <= 0) return false;
  if(G.highScores.length === 0) return true;
  if(G.highScores.length < CONFIG.MAX_HIGH_SCORES){
    const lowest = G.highScores[G.highScores.length-1].score;
    return score > lowest;
  }
  return score > G.highScores[CONFIG.MAX_HIGH_SCORES-1].score;
}

/* ============================================================
   6. JUGADOR
============================================================ */
function makePlayer(){
  return {
    x: CONFIG.WIDTH/2, y: CONFIG.HEIGHT-70,
    w: 40, h: 46,
    speed: CONFIG.PLAYER_SPEED,
    invuln: 0,
    fireCooldown: 0,
    hurtFlash: 0,
    dying: false,
    deathTimer: 0,
    animT: 0,
    facing: 0, // -1 left, 0 idle, 1 right
    shootFlash: 0
  };
}

function updatePlayer(dt){
  const p = G.player;
  if(p.dying){
    p.deathTimer += dt;
    return;
  }
  p.animT += dt;
  let moveDir = 0;
  if(Input.left){ moveDir = -1; }
  if(Input.right){ moveDir = 1; }
  p.facing = moveDir;
  p.x += moveDir * p.speed * (dt/16.67);
  p.x = Math.max(30, Math.min(CONFIG.WIDTH-30, p.x));

  if(p.invuln>0) p.invuln -= dt;
  if(p.hurtFlash>0) p.hurtFlash -= dt;
  if(p.shootFlash>0) p.shootFlash -= dt;
  if(p.fireCooldown>0) p.fireCooldown -= dt;

  if(Input.shoot && p.fireCooldown<=0){
    fireBolt();
    p.fireCooldown = CONFIG.FIRE_COOLDOWN_MS;
    p.shootFlash = 120;
  }
}

function fireBolt(){
  const ft = FIREBALL_TYPES[G.activeFireball];
  G.playerBolts.push({
    x: G.player.x, y: G.player.y-30,
    vy: -CONFIG.FIREBALL_SPEED * ft.speedMult,
    type: ft.key, damage: ft.damage, pierceLeft: ft.pierce, r: 9
  });
  Audio_.SFX.shoot();
}

function damagePlayer(){
  const p = G.player;
  if(p.invuln>0 || p.dying) return;
  G.hearts -= 1;
  p.invuln = CONFIG.INVULN_MS;
  p.hurtFlash = CONFIG.INVULN_MS;
  G.screenShake = 10;
  Audio_.SFX.playerHurt();
  spawnParticles(p.x,p.y,'#ff5555',10);
  if(G.hearts<=0){
    G.hearts = 0;
    p.dying = true;
    p.deathTimer = 0;
    Audio_.SFX.gameOver();
    Audio_.stopMusic();
  }
}

/* ============================================================
   7. GOBLINS
============================================================ */
function weightedGoblinType(wave){
  const avail = Object.values(GOBLIN_TYPES).filter(t=>t.minWave<=wave);
  const total = avail.reduce((s,t)=>s+t.weight,0);
  let r = Math.random()*total;
  for(const t of avail){ if(r<t.weight) return t; r -= t.weight; }
  return avail[0];
}

function spawnGoblin(type, slotX, slotY){
  const speedMult = 1 + (G.wave-1)*CONFIG.WAVE_SPEED_STEP;
  G.goblins.push({
    type: type.key, cfg: type,
    x: slotX, y: -40,
    targetX: slotX, targetY: slotY,
    hp: type.hp, maxHp: type.hp,
    speed: type.baseSpeed * speedMult,
    attackTimer: 800 + Math.random()*type.attackInterval,
    attackInterval: type.attackInterval * Math.pow(CONFIG.WAVE_ATTACK_MULT, G.wave-1),
    phase: Math.random()*Math.PI*2,
    state:'entering',
    diveTimer: 1500+Math.random()*3000,
    hitFlash:0,
    animT: Math.random()*1000
  });
}

function updateGoblins(dt){
  const t = dt/16.67;
  for(const g of G.goblins){
    g.animT += dt;
    if(g.hitFlash>0) g.hitFlash -= dt;
    if(g.state==='entering'){
      const dx = g.targetX-g.x, dy = g.targetY-g.y;
      const dist = Math.hypot(dx,dy);
      if(dist<3){ g.state='formation'; }
      else { g.x += dx/dist * g.speed*2.4*t; g.y += dy/dist * g.speed*2.4*t; }
    } else if(g.state==='formation'){
      g.phase += 0.02*t;
      g.x = g.targetX + Math.sin(g.phase)*(g.cfg.behavior==='zigzag'?38:16);
      g.y = g.targetY + Math.cos(g.phase*0.7)*6;

      if(g.cfg.behavior==='dive'){
        g.diveTimer -= dt;
        if(g.diveTimer<=0){ g.state='diving'; g.diveTarget = G.player.x; }
      }

      g.attackTimer -= dt;
      if(g.attackTimer<=0 && g.cfg.behavior!=='dive'){
        enemyShoot(g);
        g.attackTimer = g.attackInterval*(0.8+Math.random()*0.4);
      }
    } else if(g.state==='diving'){
      const dx = (g.diveTarget - g.x);
      g.x += Math.max(-1,Math.min(1,dx*0.02)) * g.speed*3*t;
      g.y += g.speed*2.6*t;
      if(g.y > CONFIG.HEIGHT+40){
        g.state='formation'; g.y = g.targetY-60; g.diveTimer = 3000+Math.random()*3000;
      } else if(g.y > CONFIG.HEIGHT-100 && Math.random()<0.05){
        enemyShoot(g);
      }
    }
  }
}

function enemyShoot(g){
  const dx = G.player.x - g.x, dy = G.player.y - g.y;
  const dist = Math.hypot(dx,dy) || 1;
  G.enemyBolts.push({
    x:g.x, y:g.y+10,
    vx: (dx/dist)*CONFIG.ENEMY_PROJECTILE_SPEED,
    vy: (dy/dist)*CONFIG.ENEMY_PROJECTILE_SPEED,
    color: g.cfg.color, r:7
  });
}

function killGoblin(g, idx){
  G.score += g.cfg.score;
  spawnParticles(g.x,g.y,g.cfg.color,14);
  Audio_.SFX.goblinDie();
  G.goblins.splice(idx,1);
}

/* ============================================================
   8. PROYECTILES (jugador)
============================================================ */
function updatePlayerBolts(dt){
  const t = dt/16.67;
  for(let i=G.playerBolts.length-1;i>=0;i--){
    const b = G.playerBolts[i];
    b.y += b.vy*t;
    if(b.y < -20){ G.playerBolts.splice(i,1); continue; }
  }
}
function updateEnemyBolts(dt){
  const t = dt/16.67;
  for(let i=G.enemyBolts.length-1;i>=0;i--){
    const b = G.enemyBolts[i];
    b.x += b.vx*t; b.y += b.vy*t;
    if(b.y>CONFIG.HEIGHT+20 || b.y<-20 || b.x<-20 || b.x>CONFIG.WIDTH+20){ G.enemyBolts.splice(i,1); }
  }
}

/* ============================================================
   9. FIREBALLS ESPECIALES (pickups)
============================================================ */
function scheduleSpecialSpawn(){
  G.specialSpawnTimer = CONFIG.SPECIAL_MIN_INTERVAL_MS + Math.random()*(CONFIG.SPECIAL_MAX_INTERVAL_MS-CONFIG.SPECIAL_MIN_INTERVAL_MS);
}
function scheduleSoulSpawn(){
  G.soulSpawnTimer = CONFIG.SOUL_MIN_INTERVAL_MS + Math.random()*(CONFIG.SOUL_MAX_INTERVAL_MS-CONFIG.SOUL_MIN_INTERVAL_MS);
}

function updatePickupTimers(dt){
  G.specialSpawnTimer -= dt;
  if(G.specialSpawnTimer<=0){
    const key = SPECIAL_KEYS[Math.floor(Math.random()*SPECIAL_KEYS.length)];
    G.specialPickups.push({ x: 80+Math.random()*(CONFIG.WIDTH-160), y:-30, vy:1.1, key, bob:0 });
    scheduleSpecialSpawn();
  }
  G.soulSpawnTimer -= dt;
  if(G.soulSpawnTimer<=0){
    if(G.hearts < CONFIG.PLAYER_MAX_HEARTS){
      G.souls.push({ x: 80+Math.random()*(CONFIG.WIDTH-160), y:-30, vy:0.9, bob:0 });
    }
    scheduleSoulSpawn();
  }
}

function updateFloatingPickups(dt){
  const t = dt/16.67;
  for(let i=G.specialPickups.length-1;i>=0;i--){
    const s = G.specialPickups[i];
    s.bob += dt*0.005;
    s.y += s.vy*t;
    if(s.y>CONFIG.HEIGHT+30) G.specialPickups.splice(i,1);
  }
  for(let i=G.souls.length-1;i>=0;i--){
    const s = G.souls[i];
    s.bob += dt*0.005;
    s.y += s.vy*t;
    if(s.y>CONFIG.HEIGHT+30) G.souls.splice(i,1);
  }
  if(G.fireballTimer>0){
    G.fireballTimer -= dt;
    if(G.fireballTimer<=0){
      G.activeFireball = 'normal';
      Audio_.SFX.specialExpire();
    }
  }
}

/* ============================================================
   11. COLISIONES
============================================================ */
function circleHit(ax,ay,ar,bx,by,br){
  const dx=ax-bx, dy=ay-by;
  return (dx*dx+dy*dy) <= (ar+br)*(ar+br);
}

function checkCollisions(){
  // player bolts vs goblins
  for(let bi=G.playerBolts.length-1; bi>=0; bi--){
    const b = G.playerBolts[bi];
    let consumed = false;
    for(let gi=G.goblins.length-1; gi>=0; gi--){
      const g = G.goblins[gi];
      if(circleHit(b.x,b.y,b.r, g.x,g.y, g.cfg.size/2)){
        g.hp -= b.damage;
        g.hitFlash = 120;
        spawnParticles(b.x,b.y,'#ffd54f',5);
        if(g.hp<=0){ killGoblin(g, gi); }
        b.pierceLeft -= 1;
        if(b.pierceLeft<=0){ consumed = true; }
        if(consumed) break;
      }
    }
    if(consumed){ G.playerBolts.splice(bi,1); }
  }
  // enemy bolts vs player
  if(G.player && !G.player.dying && G.player.invuln<=0){
    for(let i=G.enemyBolts.length-1;i>=0;i--){
      const b = G.enemyBolts[i];
      if(circleHit(b.x,b.y,b.r, G.player.x, G.player.y-10, 16)){
        G.enemyBolts.splice(i,1);
        damagePlayer();
      }
    }
    // goblin body contact
    for(let gi=G.goblins.length-1; gi>=0; gi--){
      const g = G.goblins[gi];
      if(circleHit(g.x,g.y,g.cfg.size/2, G.player.x, G.player.y-10, 16)){
        damagePlayer();
      }
    }
  }
  // player vs souls
  if(G.player && !G.player.dying){
    for(let i=G.souls.length-1;i>=0;i--){
      const s = G.souls[i];
      if(circleHit(s.x,s.y,14, G.player.x, G.player.y-10, 20)){
        if(G.hearts < CONFIG.PLAYER_MAX_HEARTS){ G.hearts++; }
        G.souls.splice(i,1);
        Audio_.SFX.soulPickup();
        spawnParticles(s.x,s.y,'#ff8fb3',12);
        G.pigHealFlash = 800;
      }
    }
    for(let i=G.specialPickups.length-1;i>=0;i--){
      const s = G.specialPickups[i];
      if(circleHit(s.x,s.y,14, G.player.x, G.player.y-10, 20)){
        G.activeFireball = s.key;
        G.fireballTimer = CONFIG.SPECIAL_DURATION_MS;
        G.specialPickups.splice(i,1);
        Audio_.SFX.specialPickup();
        spawnParticles(s.x,s.y,FIREBALL_TYPES[s.key].color,12);
      }
    }
  }
}

   12. OLEADAS
============================================================ */
function startWave(){
  G.wave += 1;
  const count = CONFIG.WAVE_BASE_COUNT + (G.wave-1)*CONFIG.WAVE_COUNT_STEP;
  G.waveQueue = [];
  const cols = 8;
  for(let i=0;i<count;i++){
    const col = i%cols, row = Math.floor(i/cols);
    const slotX = 90 + col*((CONFIG.WIDTH-180)/(cols-1));
    const slotY = 70 + row*54;
    G.waveQueue.push({ type: weightedGoblinType(G.wave), slotX, slotY });
  }
  G.waveSpawnTimer = 0;
  G.waveBanner.active = true;
  G.waveBanner.timer = 1600;
  G.waveBanner.text = 'WAVE ' + String(G.wave).padStart(2,'0');
  Audio_.SFX.waveStart();
}

function updateWaveSpawning(dt){
  if(G.waveBanner.active){
    G.waveBanner.timer -= dt;
    if(G.waveBanner.timer<=0) G.waveBanner.active=false;
    return; // hold spawning until banner ends
  }
  if(G.waveQueue && G.waveQueue.length){
    G.waveSpawnTimer -= dt;
    if(G.waveSpawnTimer<=0){
      const next = G.waveQueue.shift();
      spawnGoblin(next.type, next.slotX, next.slotY);
      G.waveSpawnTimer = 260;
    }
  } else if(G.goblins.length===0){
    G.waveClearDelay -= dt;
    if(G.waveClearDelay===undefined || isNaN(G.waveClearDelay)) G.waveClearDelay = 1200;
    if(G.waveClearDelay<=0){
      G.waveClearDelay = 1200;
      startWave();
    }
  }
}

/* ============================================================
   18. RENDERIZADO
============================================================ */
function pixelCircle(ox, oy, r, unit, color){
  ctx.fillStyle = color;
  const steps = Math.ceil(r/unit)+1;
  for(let gy=-steps; gy<=steps; gy++){
    for(let gx=-steps; gx<=steps; gx++){
      const cx = gx*unit, cy = gy*unit;
      if(cx*cx+cy*cy <= r*r){
        ctx.fillRect(Math.round(ox+cx-unit/2), Math.round(oy+cy-unit/2), unit, unit);
      }
    }
  }
}

const HEART_BITMAP = [
  '0110110',
  '1111111',
  '1111111',
  '0111110',
  '0011100',
  '0001000'
];
function drawPixelHeart(ox,oy,unit,color,strokeOnly){
  for(let ry=0; ry<HEART_BITMAP.length; ry++){
    for(let rx=0; rx<HEART_BITMAP[ry].length; rx++){
      if(HEART_BITMAP[ry][rx]==='1'){
        const px = Math.round(ox+rx*unit), py = Math.round(oy+ry*unit);
        if(strokeOnly){ ctx.strokeRect(px+0.5,py+0.5,unit-1,unit-1); }
        else { ctx.fillStyle = color; ctx.fillRect(px,py,unit,unit); }
      }
    }
  }
}

function drawBackground(t){
  ctx.fillStyle = '#0d0616';
  ctx.fillRect(0,0,CONFIG.WIDTH,CONFIG.HEIGHT);
  // bricks (pixel-art grid, sin degradado)
  ctx.strokeStyle = 'rgba(120,90,160,0.16)';
  ctx.lineWidth = 2;
  const brickW=50, brickH=30;
  for(let row=0; row*brickH < CONFIG.HEIGHT; row++){
    const offset = (row%2===0)?0:brickW/2;
    for(let col=-1; col*brickW < CONFIG.WIDTH+brickW; col++){
      ctx.strokeRect(Math.round(col*brickW+offset)+1, row*brickH+1, brickW-2, brickH-2);
    }
  }
  // vinieta en bloques (sin gradiente) para mantener el look retro
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  const bw = 34;
  ctx.fillRect(0,0,CONFIG.WIDTH,bw);
  ctx.fillRect(0,CONFIG.HEIGHT-bw,CONFIG.WIDTH,bw);
  ctx.fillRect(0,0,bw,CONFIG.HEIGHT);
  ctx.fillRect(CONFIG.WIDTH-bw,0,bw,CONFIG.HEIGHT);
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.fillRect(0,bw,CONFIG.WIDTH,18);
  ctx.fillRect(0,CONFIG.HEIGHT-bw-18,CONFIG.WIDTH,18);
  // torches
  drawTorch(50, 60, t);
  drawTorch(CONFIG.WIDTH-50, 60, t);
  drawTorch(50, CONFIG.HEIGHT-60, t);
  drawTorch(CONFIG.WIDTH-50, CONFIG.HEIGHT-60, t);
}

function drawTorch(x,y,t){
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  const U = 3;
  ctx.fillStyle = '#3b2a1a';
  ctx.fillRect(-3,-4,6,20);
  const frame = Math.floor(t/150)%2;
  pixelCircle(0,-22,16,U, frame===0 ? 'rgba(255,150,40,0.32)' : 'rgba(255,170,60,0.28)');
  const flameRows = frame===0 ? [2,4,6,5,3,1] : [1,3,5,6,4,2];
  let fy = -40;
  flameRows.forEach((w,i)=>{
    ctx.fillStyle = i<2 ? '#fff2a8' : (i<4 ? '#ffcc55' : '#ff8c33');
    ctx.fillRect(Math.round(-w*U/2), fy, w*U, U+1);
    fy += U;
  });
  ctx.restore();
}

function drawWizard(p){
  ctx.save();
  const U = 3;
  ctx.translate(Math.round(p.x), Math.round(p.y));
  if(p.dying){
    const prog = Math.min(1, p.deathTimer/900);
    ctx.globalAlpha = 1-prog;
    ctx.translate(0, Math.floor(prog*30));
  }
  const bob = p.dying?0:Math.round(Math.sin(p.animT/220)*3);
  ctx.translate(0, bob);
  const lean = Math.round(p.facing*6);

  if(p.hurtFlash>0 && Math.floor(p.hurtFlash/100)%2===0){
    ctx.globalAlpha *= 0.35;
  }

  // ROBE: filas apiladas que se ensanchan (trapecio de pixeles)
  const robeRows = [8,10,12,14,16,18,20,22,26,30,34,38,44];
  let ry = -28;
  robeRows.forEach((w,i)=>{
    ctx.fillStyle = (i%4===3) ? '#241a48' : '#3a2a6b';
    ctx.fillRect(Math.round(-w/2+lean), ry, w, U+1);
    ry += U;
  });
  ctx.fillStyle = '#1c1440';
  ctx.fillRect(Math.round(-22+lean), ry, 44, 6);

  // BASTON
  ctx.fillStyle = '#5a3a20';
  const staffX = 15+lean*0.5;
  ctx.fillRect(Math.round(staffX), -8, U, 34);
  ctx.fillRect(Math.round(staffX-3), -12, U+6, 4);
  // ORBE (verde, pegado a la punta del baston)
  const orbColor = p.shootFlash>0 ? '#b6ff6e' : '#43a047';
  pixelCircle(staffX+2, -16, 7, U, orbColor);

  // CABEZA
  pixelCircle(lean*0.4, -34, 11, U, '#e8c39e');

  // SOMBRERO (triangulo de filas pegado al ala, sin huecos) + ala
  const hatRows = [2,6,10,14,18,22,26];
  let hy = -63;
  hatRows.forEach(w=>{
    ctx.fillStyle = '#4b2f8a';
    ctx.fillRect(Math.round(-w/2+lean*0.5), hy, w, U+1);
    hy += U;
  });
  ctx.fillStyle = '#8b6fd1';
  ctx.fillRect(Math.round(-15+lean*0.4), hy-1, 30, U+2);

  // OJOS
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(Math.round(-6+lean*0.4), -35, U, U);
  ctx.fillRect(Math.round(3+lean*0.4), -35, U, U);

  ctx.restore();
}

function drawGoblin(g){
  ctx.save();
  ctx.translate(Math.round(g.x), Math.round(g.y));
  const wob = Math.round(Math.sin(g.animT/150)*2);
  ctx.translate(0,wob);
  if(g.hitFlash>0){ ctx.filter = 'brightness(2.1)'; }
  const s = g.cfg.size;
  const U = Math.max(2, Math.round(s/9));

  pixelCircle(0, s*0.14, s*0.52, U, g.cfg.dark);
  pixelCircle(0, 0, s*0.42, U, g.cfg.color);
  // orejas puntiagudas (escalera de pixeles que se afina hacia la punta)
  ctx.fillStyle = g.cfg.color;
  const earSteps = [
    {ox:0.38, w:2.6, oy:0.18},
    {ox:0.45, w:2.0, oy:0.27},
    {ox:0.52, w:1.4, oy:0.36},
    {ox:0.59, w:0.8, oy:0.45}
  ];
  earSteps.forEach(step=>{
    const width = Math.max(2, Math.round(step.w*U));
    const y = Math.round(-s*step.oy);
    ctx.fillRect(Math.round(-s*step.ox - width), y, width, U);
    ctx.fillRect(Math.round(s*step.ox), y, width, U);
  });
  // ojos
  ctx.fillStyle = '#fff200';
  ctx.fillRect(Math.round(-s*0.24), Math.round(-s*0.10), U*1.6, U*1.6);
  ctx.fillRect(Math.round(s*0.24-U*1.6), Math.round(-s*0.10), U*1.6, U*1.6);
  ctx.fillStyle = '#000';
  ctx.fillRect(Math.round(-s*0.17), Math.round(-s*0.04), U*0.8, U*0.8);
  ctx.fillRect(Math.round(s*0.17-U*0.8), Math.round(-s*0.04), U*0.8, U*0.8);
  // boca
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(Math.round(-s*0.14), Math.round(s*0.16), Math.round(s*0.28), Math.max(2,U*0.8));

  ctx.filter = 'none';
  if(g.maxHp>1){
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.fillRect(-s*0.5, -s*0.75, s, 4);
    ctx.fillStyle='#5fff6b';
    ctx.fillRect(-s*0.5, -s*0.75, s*(g.hp/g.maxHp), 4);
  }
  ctx.restore();
}

function pixelTextWidth(text, scale){
  const charW = 5*scale, gap = scale;
  return text.length>0 ? text.length*charW + (text.length-1)*gap : 0;
}
function drawPixelGlyph(glyph, x, y, scale, color){
  ctx.fillStyle = color;
  for(let r=0;r<glyph.length;r++){
    for(let c=0;c<glyph[r].length;c++){
      if(glyph[r][c]==='1'){
        ctx.fillRect(Math.round(x+c*scale), Math.round(y+r*scale), scale, scale);
      }
    }
  }
}
function drawPixelText(text, cx, y, scale, color, shadowColor, shadowOffset){
  const charW = 5*scale, gap = scale;
  let x = cx - pixelTextWidth(text, scale)/2;
  for(const ch of text.toUpperCase()){
    const glyph = PIXEL_FONT[ch] || PIXEL_FONT[' '];
    if(shadowColor){ drawPixelGlyph(glyph, x+shadowOffset, y+shadowOffset, scale, shadowColor); }
    drawPixelGlyph(glyph, x, y, scale, color);
    x += charW+gap;
  }
}

function drawParticles(){
  for(const p of G.particles){

const VKB_ROWS = ['ABCDEFGHIJ','KLMNOPQRST','UVWXYZ0123','456789 <-<'];
function drawVirtualKeyboard(startY, keyW, keyH, gap){
  startY = startY!==undefined ? startY : 410;
  keyW = keyW || 60; keyH = keyH || 34; gap = gap!==undefined ? gap : 4;
  VKB_ROWS.forEach((row,ri)=>{
    const chars = row.split('');
    const rowWidth = chars.length*(keyW+gap)-gap;
    const startX = CONFIG.WIDTH/2 - rowWidth/2;
    chars.forEach((ch,ci)=>{
      const x = startX+ci*(keyW+gap), y = startY+ri*(keyH+gap);
      ctx.fillStyle='rgba(255,255,255,0.12)';
      ctx.fillRect(x,y,keyW,keyH);
      ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=2; ctx.strokeRect(x,y,keyW,keyH);
      ctx.fillStyle='#fff'; ctx.font='bold '+Math.max(12,Math.round(keyH*0.42))+'px "Courier New", monospace';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      let label = ch;
      if(row[ci]==='<' && ci===chars.length-1) label='DEL';
      else if(ch===' ') label='SPC';
      ctx.fillText(label, x+keyW/2, y+keyH/2);
    });
  });
  ctx.textBaseline='alphabetic';
}
function vkbHit(x,y, target, maxLen, startY, keyW, keyH, gap){
  startY = startY!==undefined ? startY : 410;
  keyW = keyW || 60; keyH = keyH || 34; gap = gap!==undefined ? gap : 4;
  for(let ri=0; ri<VKB_ROWS.length; ri++){
    const chars = VKB_ROWS[ri].split('');
    const rowWidth = chars.length*(keyW+gap)-gap;
    const startX = CONFIG.WIDTH/2 - rowWidth/2;
    for(let ci=0; ci<chars.length; ci++){
      const kx = startX+ci*(keyW+gap), ky = startY+ri*(keyH+gap);
      if(x>=kx && x<=kx+keyW && y>=ky && y<=ky+keyH){
        if(ri===3 && ci===chars.length-1){ target.text = target.text.slice(0,-1); return true; }
        const ch = chars[ci];
        if(target.text.length < maxLen){ target.text += (ch===' '?' ':ch); }
        return true;
      }
    }
  }
  return false;
}

/* ============================================================
   MODO ATRACCION
============================================================ */
function updateAttractMode(dt){
  if(G.state!==STATES.TITLE && G.state!==STATES.MENU) return;
  G.idleTimer += dt;
  if(!G.attractMode && G.idleTimer > CONFIG.ATTRACT_TIMEOUT_MS){
    G.attractMode = true;
    G.attractPhase = 0;
    G.attractTimer = 0;
  }
  if(G.attractMode){
    G.attractTimer += dt;
    const seq = [ {p:'title', d:5000}, {p:'demo', d:6000}, {p:'high', d:4000}, {p:'how', d:5000} ];
    let acc=0, phase=seq[0];
    for(const s of seq){ if(G.attractTimer < acc+s.d){ phase=s.p; break; } acc+=s.d; }
    if(G.attractTimer >= acc && phase===seq[seq.length-1].p && G.attractTimer >= seq.reduce((s,x)=>s+x.d,0)){
      G.attractTimer = 0;
    }
    G.attractDisplay = phase;
    updateAttractDemo(dt, phase==='demo');
  }
}

let attractDemo = null;
function updateAttractDemo(dt, active){
  if(!active){ attractDemo=null; return; }
  if(!attractDemo){
    attractDemo = { player:{x:400,y:530,animT:0,facing:0,dying:false,hurtFlash:0,shootFlash:0}, goblins:[], bolts:[], timer:0, spawnTimer:0 };
  }
  const d = attractDemo;
  d.timer += dt; d.spawnTimer -= dt;
  d.player.animT += dt;
  d.player.x = 400 + Math.sin(d.timer/900)*220;
  d.player.facing = Math.sin(d.timer/900)>0?1:-1;
  if(d.spawnTimer<=0){
    const typesArr = Object.values(GOBLIN_TYPES);
    const type = typesArr[Math.floor(Math.random()*typesArr.length)];
    d.goblins.push({x:80+Math.random()*640, y:-20, cfg:type, hp:type.hp, maxHp:type.hp, hitFlash:0, animT:0, vy:0.6+Math.random()*0.5});
    d.spawnTimer = 700;
  }
  if(Math.random()<0.05){ d.bolts.push({x:d.player.x, y:d.player.y-30, vy:-8, type:'normal', r:9}); }
  for(let i=d.goblins.length-1;i>=0;i--){
    const g = d.goblins[i]; g.y += g.vy*(dt/16.67); g.animT+=dt;
    if(g.y>640) d.goblins.splice(i,1);
  }
  for(let i=d.bolts.length-1;i>=0;i--){
    const b = d.bolts[i]; b.y += b.vy*(dt/16.67);
    if(b.y<-20){ d.bolts.splice(i,1); continue; }
    for(let j=d.goblins.length-1;j>=0;j--){
      const g = d.goblins[j];
      if(Math.hypot(b.x-g.x,b.y-g.y) < g.cfg.size/2+9){ d.goblins.splice(j,1); d.bolts.splice(i,1); spawnParticles(g.x,g.y,g.cfg.color,8); break; }
    }
  }
}

/* ============================================================
   19. GAME LOOP
============================================================ */
function handleGlobalInput(){
  if(Input.enterPressed){
    Input.enterPressed = false;
    onEnter();
  }
  if(Input.escapePressed){
    Input.escapePressed = false;
    onEscape();
  }
  if(Input.pausePressed){
    Input.pausePressed = false;
    onPauseKey();
  }
  if(Input.up || Input.down){
    handleMenuAxis();
  }
}

let axisCooldown = 0;
function handleMenuAxis(){
  if(axisCooldown>0) return;
  axisCooldown = 180;
  if(G.state===STATES.MENU){
    if(Input.up){ G.menuIndex = (G.menuIndex-1+MENU_ITEMS.length)%MENU_ITEMS.length; Audio_.SFX.navigate(); }
    if(Input.down){ G.menuIndex = (G.menuIndex+1)%MENU_ITEMS.length; Audio_.SFX.navigate(); }
  } else if(G.state===STATES.OPTIONS){
    if(!G.optionsConfirm){
      if(Input.up){ G.optionsIndex = (G.optionsIndex-1+OPTIONS_ITEMS.length)%OPTIONS_ITEMS.length; Audio_.SFX.navigate(); }
      if(Input.down){ G.optionsIndex = (G.optionsIndex+1)%OPTIONS_ITEMS.length; Audio_.SFX.navigate(); }
    } else {
      G.optionsConfirmIndex = 1-G.optionsConfirmIndex; Audio_.SFX.navigate();
    }
  }
}

function onEnter(){
  resetIdle();
  if(G.state===STATES.TITLE){ goToMenu(); }
  else if(G.state===STATES.MENU){ confirmMenu(); }
  else if(G.state===STATES.HIGH_SCORES){ G.state = STATES.MENU; Audio_.SFX.navigate(); }
  else if(G.state===STATES.HOW_TO_PLAY){ G.state = STATES.MENU; Audio_.SFX.navigate(); }
  else if(G.state===STATES.OPTIONS){ handleOptionsConfirm(); }
  else if(G.state===STATES.PAUSED){ /* no-op, P resumes */ }
  else if(G.state===STATES.GAME_OVER){ advanceGameOver(); }
  else if(G.state===STATES.NAME_ENTRY){ confirmNameEntry(); }
  else if(G.state===STATES.PASSWORD_ENTRY){ confirmPasswordEntry(); }
}
function onEscape(){
  if(G.state===STATES.HIGH_SCORES||G.state===STATES.HOW_TO_PLAY){ G.state=STATES.MENU; Audio_.SFX.navigate(); }
  else if(G.state===STATES.OPTIONS){
    if(G.optionsConfirm){ G.optionsConfirm=false; }
    else { G.state = STATES.MENU; Audio_.SFX.navigate(); }
  }
  else if(G.state===STATES.PASSWORD_ENTRY){
    G.passwordEntry.text = ''; G.passwordError = 0;
    G.state = STATES.OPTIONS; Audio_.SFX.navigate();
  }
}
function onPauseKey(){
  if(G.state===STATES.PLAYING){ G.state=STATES.PAUSED; Audio_.SFX.pause(); }
  else if(G.state===STATES.PAUSED){ G.state=STATES.PLAYING; Audio_.SFX.resume(); }
}

function handleOptionsConfirm(){
  const item = OPTIONS_ITEMS[G.optionsIndex];
  if(G.optionsConfirm){
    if(G.optionsConfirmIndex===0){
      G.optionsConfirm = false;
      G.passwordEntry.text = ''; G.passwordError = 0;
      G.state = STATES.PASSWORD_ENTRY;
      Audio_.SFX.select();
    } else {
      G.optionsConfirm = false;
    }
    return;
  }
  Audio_.SFX.select();
  if(item==='SOUND'){ G.options.sound = !G.options.sound; savePersisted(); }
  else if(item==='MUSIC'){ G.options.music = !G.options.music; savePersisted(); if(G.options.music){ Audio_.startMusic(G.state===STATES.PLAYING?'play':'title'); } else { Audio_.stopMusic(); } }
  else if(item==='SFX VOLUME'){ G.options.sfxVol = Math.round((G.options.sfxVol+0.1)%1.01*10)/10; if(G.options.sfxVol>1) G.options.sfxVol=0; savePersisted(); }
  else if(item==='MUSIC VOLUME'){ G.options.musicVol = Math.round((G.options.musicVol+0.1)%1.01*10)/10; if(G.options.musicVol>1) G.options.musicVol=0; savePersisted(); }
  else if(item==='REFRESH GLOBAL SCORES'){
    refreshGlobalHighScores();
    G.optionsMessage = 'GLOBAL RANKING REFRESHED';
    G.optionsMessageTimer = 1800;
  }
}

function update(dt){
  if(axisCooldown>0) axisCooldown -= dt;
  handleGlobalInput();
  updateAttractMode(dt);

  switch(G.state){
    case STATES.PLAYING:
      updatePlayer(dt);
      updateGoblins(dt);
      updatePlayerBolts(dt);
      updateEnemyBolts(dt);
      updatePickupTimers(dt);
      updateFloatingPickups(dt);
      updateParticles(dt);
      checkCollisions();
      updateWaveSpawning(dt);
      if(G.player.dying && G.player.deathTimer>900){
        triggerGameOver();
      }
      if(G.screenShake>0) G.screenShake -= dt*0.5;
      break;
    case STATES.PAUSED:
      break;
    default:
      updateParticles(dt);
      break;
  }
}

function render(){
  ctx.save();
  if(G.screenShake>0){
    ctx.translate((Math.random()-0.5)*G.screenShake, (Math.random()-0.5)*G.screenShake);
  }
  const t = performance.now();
  switch(G.state){
    case STATES.TITLE:
      if(G.attractMode){
        if(G.attractDisplay==='demo') renderAttractDemo();
        else if(G.attractDisplay==='high') renderHighScores();
        else if(G.attractDisplay==='how') renderHowToPlay();
        else renderTitle(t);
      } else {
        renderTitle(t);
      }
      break;
    case STATES.MENU:
      if(G.attractMode){
        if(G.attractDisplay==='demo') renderAttractDemo();
        else if(G.attractDisplay==='high') renderHighScores();
        else if(G.attractDisplay==='how') renderHowToPlay();
        else renderMenu(t);
      } else {
        renderMenu(t);
      }
      break;
    case STATES.HIGH_SCORES: renderHighScores(); break;
    case STATES.HOW_TO_PLAY: renderHowToPlay(); break;
    case STATES.OPTIONS: renderOptions(); break;
    case STATES.PLAYING: renderGameplayWorld(t); break;
    case STATES.PAUSED: renderPaused(t); break;
    case STATES.GAME_OVER: renderGameOver(); break;
    case STATES.NAME_ENTRY: renderNameEntry(); break;
    case STATES.PASSWORD_ENTRY: renderPasswordEntry(); break;
  }
  if(isTouchDevice() && !G.attractMode && [STATES.TITLE,STATES.MENU,STATES.HIGH_SCORES,STATES.HOW_TO_PLAY,STATES.OPTIONS,STATES.GAME_OVER].includes(G.state)){
    drawMenuNavButtons();
  }
  ctx.restore();
}

function loop(ts){
  if(!G.lastTime) G.lastTime = ts;
  let dt = ts - G.lastTime;
  G.lastTime = ts;
  if(dt>80) dt=80; // avoid huge jumps on tab switch
  G.frame++;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

/* ============================================================
   ARRANQUE
============================================================ */
loadPersisted();
refreshGlobalHighScores();
goToTitle();
requestAnimationFrame(loop);

})();
</script>
